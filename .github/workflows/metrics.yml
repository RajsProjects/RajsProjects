name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: RajsProjects

          base: header, activity, community, repositories

          plugin_languages: yes
          plugin_followup: yes
          plugin_isocalendar: yes
          plugin_stars: yes